[package]
authors = ["Ballerina"]
distribution = "2201.12.0"
keywords = ["Agent", "Ollama", "Model", "Provider", "Vendor/Ollama", "Area/AI & Machine Learning", "Type/Model Provider", "Type/Connector", "Name/Ollama Model Provider"]
license = ["Apache-2.0"]
icon="icon.png"
name = "ai.ollama"
org = "ballerinax"
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.ollama"
version = "1.3.0"

# TODO: drop `repository = "local"` once the `ai` streaming contract
# (`chatStream`/`generateStream`) is released to Ballerina Central. The published
# 1.13.0 does NOT carry it - this pin resolves a locally built bala, so CI cannot
# build this branch until that release lands.
[[dependency]]
org = "ballerina"
name = "ai"
version = "1.13.0"
repository = "local"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "ai.ollama-native"
version = "1.3.0"
path = "../native/build/libs/ai.ollama-native-1.3.0-SNAPSHOT.jar"
